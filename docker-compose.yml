version: '3.9'

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-insecure-prod-key-change-in-env-file-983174}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bright_user}:${POSTGRES_PASSWORD:-bright_password}@db:5432/${POSTGRES_DB:-bright_edu_prod}
      - SERVE_MEDIA_FILES=True
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bright_edu_prod}
      POSTGRES_USER: ${POSTGRES_USER:-bright_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bright_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bright_user} -d ${POSTGRES_DB:-bright_edu_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_volume:
