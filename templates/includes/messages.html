{% if messages %}
<div class="fixed top-24 right-4 z-50 max-w-md w-full space-y-3 pointer-events-none">
    {% for message in messages %}
    <div class="alert-box pointer-events-auto flex items-start p-4 rounded-xl shadow-xl border text-sm transition-all duration-300 transform translate-y-0
        {% if message.tags == 'error' %}
            bg-red-50 border-red-200 text-red-800
        {% elif message.tags == 'warning' %}
            bg-amber-50 border-amber-200 text-amber-800
        {% elif message.tags == 'success' %}
            bg-emerald-50 border-emerald-200 text-emerald-800
        {% else %}
            bg-blue-50 border-blue-200 text-blue-800
        {% endif %}">
        <div class="mr-3 text-lg mt-0.5">
            {% if message.tags == 'error' %}
                <i class="fa-solid fa-circle-exclamation text-red-600"></i>
            {% elif message.tags == 'warning' %}
                <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
            {% elif message.tags == 'success' %}
                <i class="fa-solid fa-circle-check text-emerald-600"></i>
            {% else %}
                <i class="fa-solid fa-circle-info text-blue-600"></i>
            {% endif %}
        </div>
        <div class="flex-1 font-medium">
            {{ message }}
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-3 text-slate-400 hover:text-slate-700">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
