<!-- Floating Quick Contact Buttons -->
<div class="fixed bottom-6 right-6 z-40 flex flex-col space-y-3 floating-contact-container">
    <!-- WeChat Floating Button -->
    <button type="button" class="trigger-wechat-modal floating-btn flex items-center justify-center w-14 h-14 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-2xl transition duration-300 relative group" title="Chat on WeChat">
        <i class="fa-brands fa-weixin text-2xl"></i>
        <span class="absolute right-16 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none shadow-lg">
            WeChat Scan / ID
        </span>
    </button>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/{{ site_info.WHATSAPP }}?text=Hello%20Bright%20Edu%20Consultancy!%20I%20would%20like%20to%20inquire%20about%20Study%20in%20China%20and%20scholarship%20opportunities." target="_blank" rel="noopener noreferrer" class="floating-btn flex items-center justify-center w-14 h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full shadow-2xl transition duration-300 relative group" title="Chat on WhatsApp">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span class="absolute right-16 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none shadow-lg">
            WhatsApp Live Chat
        </span>
    </a>
</div>

<!-- WeChat Modal Popup -->
<div id="wechat-modal" class="fixed inset-0 bg-slate-950/70 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative animate-in fade-in zoom-in duration-200">
        <button id="close-wechat-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-lg p-1.5 rounded-lg hover:bg-slate-100">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full mb-3">
            <i class="fa-brands fa-weixin text-2xl"></i>
        </div>

        <h3 class="text-xl font-bold text-slate-900">Connect on WeChat</h3>
        <p class="text-xs text-slate-500 mt-1 mb-4">Scan our official admissions QR code or add our counselor WeChat ID.</p>

        <!-- QR Code Image -->
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl inline-block shadow-inner mb-4">
            <img src="/static/images/wechat_qr.svg" alt="Bright Edu WeChat QR Code" class="w-48 h-48 mx-auto rounded-lg">
        </div>

        <div class="bg-slate-100 rounded-xl p-3 flex items-center justify-between mb-4">
            <div class="text-left">
                <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">WeChat ID</span>
                <span class="text-sm font-bold text-slate-800">{{ site_info.WECHAT_ID }}</span>
            </div>
            <button id="copy-wechat-btn" data-wechat-id="{{ site_info.WECHAT_ID }}" class="px-3 py-1.5 text-xs font-semibold bg-white border border-slate-300 rounded-lg hover:bg-slate-50 text-slate-700 transition">
                Copy ID
            </button>
        </div>

        <p class="text-[11px] text-slate-400">Available Mon-Sat for scholarship assessment & profile review.</p>
    </div>
</div>
